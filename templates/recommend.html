<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book-Recommendation-System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
    .card {
        background-color: #111;
        border-radius: 15px;
        transition: all 0.4s ease;
        border: 1px solid rgba(255,255,255,0.1);
    }
    
    /* 🔥 STRONG HOVER EFFECT */
    .card:hover {
        transform: translateY(-15px) scale(1.03);
        box-shadow: 
            0px 15px 30px rgba(0,255,150,0.4),
            0px 0px 15px rgba(0,255,150,0.6);
        border: 1px solid rgba(0,255,150,0.8);
    }
    
    /* 🔥 image zoom */
    .card-img-top {
        transition: 0.4s;
        border-radius: 10px;
    }
    
    .card:hover .card-img-top {
        transform: scale(1.08);
    }
    
    /* 🔥 text glow */
    .card:hover p {
        color: #00ffcc !important;
        text-shadow: 0px 0px 5px #00ffcc;
    }

    .nav-hover {
    position: relative;
    transition: all 0.3s ease;
}

/* hover lift */
.nav-hover:hover {
    transform: translateY(-4px);
    color: #00ffcc !important;
}

/* 🔥 underline animation */
.nav-hover::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0%;
    height: 2px;
    background: yellow;
    transition: 0.3s ease;
}

.nav-hover:hover::after {
    width: 100%;
}

/* 🔥 ACTIVE TAB (Recommender here) */
.nav-link.active {
    color: yellow !important;
    font-weight: bold;
    transform: translateY(-5px);
    text-shadow: 0px 0px 10px yellow;
}

/* always show underline for active */
.nav-link.active::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 2px;
    background: yellow;
    left: 0;
    bottom: 0;
}

/* 🔥 small glow pulse (subtle animation) */
@keyframes glow {
    0% { text-shadow: 0 0 5px yellow; }
    50% { text-shadow: 0 0 15px yellow; }
    100% { text-shadow: 0 0 5px yellow; }
}

.nav-link.active {
    animation: glow 1.5s infinite;
}
.title-glow {
    font-size: 50px;
    font-weight: bold;
    color: white;
    letter-spacing: 2px;
    animation: fadeSlide 1s ease forwards;
}

/* glow on hover */
.title-glow:hover {
    text-shadow: 
        0 0 10px #00ffcc,
        0 0 20px #00ffcc,
        0 0 30px #00ffcc;
}

/* ================= INPUT ================= */
.search-box {
    border-radius: 25px;
    padding: 12px;
    border: none;
    transition: 0.3s;
}

/* focus glow */
.search-box:focus {
    box-shadow: 0px 0px 15px #00ffcc;
    outline: none;
    transform: scale(1.02);
}

/* ================= BUTTON ================= */
.fancy-btn {
    border-radius: 25px;
    font-weight: bold;
    transition: all 0.3s ease;
}

/* hover effect */
.fancy-btn:hover {
    transform: scale(1.1);
    background-color: orange;
    box-shadow: 
        0px 0px 10px yellow,
        0px 0px 20px orange;
}

/* click effect */
.fancy-btn:active {
    transform: scale(0.95);
}

/* ================= ENTRY ANIMATION ================= */
@keyframes fadeSlide {
    0% {
        opacity: 0;
        transform: translateY(-20px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

.helper-box {
    animation: float 2s ease-in-out infinite;
}

/* smooth up-down movement */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0px); }
}
  
.brand-text {
    font-size: 22px;        /* not too big */
    font-weight: 600;
    letter-spacing: 1px;
    transition: 0.3s;
}

/* highlight part */
.brand-highlight {
    color: yellow;
}

/* hover effect */
.brand-text:hover {
    transform: scale(1.05);
    text-shadow: 0px 0px 10px white;
}
.title-glow,
.helper-box p,
h1 {
    user-select: none;
    cursor: default;   /* normal arrow */
}

/* optional: also for brand */
.brand-text {
    user-select: none;
    cursor: pointer;
}

.card {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 0.6s ease forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

    </style>

<body style="background-color: black">

    <nav class="navbar navbar-expand-lg navbar-dark shadow" style="background: linear-gradient(90deg,#00a65a,#007bff);">
        <div class="container-fluid">
    
            <span class="navbar-brand brand-text">
                📚 Book<span class="brand-highlight">Recommender</span>
            </span>
    
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link nav-hover" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-hover active" href="/recommend">Recommender</a>
                </li>
              
            </ul>
    
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-12">
                 <h1 class="title-glow text-center mt-3">
                    🔍 Recommender Books
                 </h1>
                 <!-- 🔥 ADD THIS BLOCK -->
                <div class="helper-box text-center mb-3">
                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" width="80">
                <p class="text-white mt-2">👋 Hey! Enter a book name to get recommendations 📚</p>
                </div>
                
                <div id="loader" style="display:none; text-align:center;">
                    <div class="spinner-border text-warning" role="status"></div>
                    <p class="text-white mt-2">Finding best books for you... 📚</p>
                </div>

                <form action="/recommend_books" method="POST" class="text-center mt-4" onsubmit="showLoader()">

                    <input name="user_input" type="text" 
                        placeholder="Enter a book name..." 
                        class="form-control form-control-lg search-box">
                
                    <br>
                
                    <button type="submit" class="btn btn-lg btn-warning fancy-btn">
                        🚀 Get Recommendations
                    </button>
                
                </form>
            </div>

            {% if error %}
            <p class="text-danger text-center">{{ error }}</p>
            {% endif %}
   
            {% if data is defined and data %}

               {% for i in data %}
                   
               <div class="col-3" style="margin-top:30px">
                <div class="card">
                    <div class="card-body text-center">

                        <!-- image size fixed -->
                        <img class="card-img-top" src="{{i[2]}}" 
                             style="height:200px; width:150px; object-fit:cover; margin:auto;">

                        <!-- book info -->
                        <p class="text-white mt-2">{{i[0]}}</p>
                        <p class="text-white">{{i[1]}}</p>
                       

                    </div>
                </div>
            </div>

               {% endfor %}
              
              {% endif %}

           
          

        </div>
    </div>
    <script>
        function showLoader(){
            document.getElementById("loader").style.display = "block";
        }
        </script>
</body>
</html>
